<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>人间值得 · 美食日记</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #fffaf5;
      color: #2d1e12;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
                  url('https://images.unsplash.com/photo-1606857521015-7f9fcf423740?w=1600') center/cover no-repeat;
      height: 80vh;
      min-height: 500px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    header h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }

    header p {
      font-size: 1.4rem;
      margin-top: 1rem;
      opacity: 0.9;
      max-width: 600px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 4rem 2rem;
    }

    h2 {
      color: #8b4513;
      text-align: center;
      font-size: 2.6rem;
      margin-bottom: 3rem;
      position: relative;
    }

    h2::after {
      content: "🍴";
      position: absolute;
      font-size: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      top: -1.8rem;
      opacity: 0.4;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 2.2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: all 0.28s ease;
    }

    .card:hover {
      transform: translateY(-12px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.13);
    }

    .card-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-content {
      padding: 1.6rem 1.8rem;
    }

    .card h3 {
      color: #4a2c0f;
      margin-bottom: 0.8rem;
      font-size: 1.5rem;
    }

    .description {
      color: #666;
      font-size: 0.98rem;
    }

    .tag {
      display: inline-block;
      background: #fff3e6;
      color: #c75f17;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      margin-top: 1rem;
    }

    footer {
      text-align: center;
      padding: 3rem 1rem;
      color: #7a5c3d;
      font-size: 0.95rem;
      border-top: 1px solid #f0d8c0;
      margin-top: 4rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 3.6rem; }
      .container { padding: 3rem 1.2rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>人间值得</h1>
  <p>因为有美食，所以值得认真活一次</p>
</header>

<div class="container">

  <h2>今日推荐</h2>

  <div class="food-grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800" alt="披萨" class="card-img">
      <div class="card-content">
        <h3>意式手工披萨</h3>
        <p class="description">刚出炉的薄底披萨，边缘微微焦脆，番茄酱酸甜浓郁，马苏里拉拉丝到犯规～</p>
        <span class="tag">· 热量预警 ·</span>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1626645738538-2c53f30e6d47?w=800" alt="蟹黄小笼包" class="card-img">
      <div class="card-content">
        <h3>蟹黄汤包</h3>
        <p class="description">轻轻咬破，鲜美的蟹黄汤汁瞬间爆开，配上一小勺姜丝醋，幸福感爆棚</p>
        <span class="tag">· 早安上海 ·</span>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1559054663-e8d23213f55c?w=800" alt="提拉米苏" class="card-img">
      <div class="card-content">
        <h3>经典提拉米苏</h3>
        <p class="description">咖啡与可可的微苦，奶油与手指饼干的柔软，甜而不腻的意大利之吻</p>
        <span class="tag">· 甜品救赎 ·</span>
      </div>
    </div>

  </div>

</div>

<footer>
  <p>愿你每天都有值得期待的一餐<br>© 2025 人间值得美食日记</p>
</footer>

</body>
</html>
